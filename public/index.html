<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Container Panel</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <h1>Container Panel</h1>
      <div id="summary" class="summary" aria-live="polite"></div>
      <div id="view-toggle" class="seg view-toggle" role="group" aria-label="Visualização">
        <button class="btn" data-view="list" title="Lista" aria-label="Visualizar em lista">☰</button>
        <button class="btn" data-view="tabs" title="Abas" aria-label="Visualizar em abas">▭</button>
      </div>
      <label class="search">
        <span class="kbd" aria-hidden="true">/</span>
        <input id="search" type="search" placeholder="Filtrar por nome, imagem ou projeto…" autocomplete="off" aria-label="Filtrar containers">
      </label>
    </div>
    <nav id="ptabs" class="ptabs wrap" aria-label="Projetos">
      <div id="ptab-list" class="ptab-list" role="tablist"></div>
      <button id="ptab-more" class="ptab-more" aria-haspopup="menu" aria-expanded="false" title="Mais projetos" hidden>…</button>
      <div id="ptab-menu" class="ptab-menu" role="menu" hidden></div>
    </nav>
  </header>

  <main id="projects" class="projects wrap"></main>

  <section id="terminals" class="terminals hidden">
    <div class="term-bar">
      <div id="tabs" class="tabs"></div>
      <button id="term-toggle" class="icon" title="Minimizar/expandir">▾</button>
    </div>
    <div id="term-panes" class="term-panes"></div>
  </section>

  <div id="toasts" class="toasts"></div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
